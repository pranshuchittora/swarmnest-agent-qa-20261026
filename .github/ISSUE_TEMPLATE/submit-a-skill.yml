name: Submit a Skill
description: Suggest an agent skill, plugin, Cursor rule, AGENTS.md template or prompt pack for Swarmnest Agent Skills.
title: "Skill submission: "
labels: ["skill-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a listing. We link to your source and write our own summary; we do not host your files. Listing is free. See https://swarmnest.ai/agent-skills/submit/
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: A public link to the skill folder, file or repository.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Agent Skill (SKILL.md)
        - Plugin Bundle
        - Cursor Rule
        - AGENTS.md Template
        - Prompt Pack
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms It Says It Supports
      options:
        - label: Claude (Code, Apps or API)
        - label: ChatGPT or Codex
        - label: Gemini (App, CLI or Antigravity)
        - label: Cursor
        - label: GitHub Copilot or VS Code
        - label: Other or any tool that reads SKILL.md
  - type: dropdown
    id: scripts
    attributes:
      label: Does the Folder Include Scripts or Executable Code?
      options:
        - No, instructions only
        - Yes
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: flags
    attributes:
      label: Does It
      options:
        - label: Use the network (fetch URLs or call APIs)
        - label: Need credentials (API keys or tokens)
  - type: input
    id: license
    attributes:
      label: License
      description: SPDX id such as MIT or Apache-2.0, or "none stated".
  - type: textarea
    id: description
    attributes:
      label: One-Line Description
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I am the author, or the source is public and allows linking to it.
          required: true
        - label: It does not harvest credentials, hide instructions from users, or impersonate a brand.
          required: true
